[project]
name = "reteaua-vie-backend"
version = "0.1.0"
description = "Rețeaua Vie: mobility back office API for Timișoara (UniHack 8)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.6",
    "geopandas>=1.2.0",
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "networkx>=3.7",
    "pandas>=3.1.1",
    "polyline>=2.0.5",
    "protobuf>=7.36.2",
    "pyarrow>=26.0.1",
    "pydantic>=2",
    "pyproj>=3.8.0",
    "pyrosm>=0.29.0",
    "pytest>=9.2.0",
    "qrcode>=8.2",
    "r5py>=1.1.7",
    "rasterio>=1.5.2",
    "shapely>=2",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pypdf>=7.1.0",
]
